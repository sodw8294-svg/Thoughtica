  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #090A0F;
      color: #f8fafc;
      transition: background-color 1s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Outfit', sans-serif;
    }

    /* =============================================
       IPHONE DYNAMIC VIEWPORT & SAFE AREA INSETS
       ============================================= */
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }
    html, body {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    .pt-safe { padding-top: var(--sat) !important; }
    .pb-safe { padding-bottom: var(--sab) !important; }
    .pl-safe { padding-left: var(--sal) !important; }
    .pr-safe { padding-right: var(--sar) !important; }
    .mt-safe { margin-top: var(--sat) !important; }
    .mb-safe { margin-bottom: var(--sab) !important; }

    /* =============================================
       GLOBAL FORM ELEMENT FIX — dark mode ready
       ============================================= */
    input, textarea, select {
      background-color: rgba(15, 23, 42, 0.75) !important;
      color: #f8fafc !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      border-radius: 12px !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-size: 16px !important; /* Prevents iOS Safari auto-zoom on mobile */
      -webkit-appearance: none;
      appearance: none;
      outline: none !important;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.4) !important;
    }
    input::placeholder, textarea::placeholder {
      color: rgba(148, 163, 184, 0.7) !important;
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(168, 85, 247, 0.7) !important;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2), inset 0 1px 2px rgba(0,0,0,0.4) !important;
    }
    /* Force select option dropdowns dark */
    select option {
      background-color: #0f1117 !important;
      color: #f1f5f9 !important;
    }
    /* Kill browser autofill yellow/blue overlay */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px #0f1117 inset !important;
      -webkit-text-fill-color: #f1f5f9 !important;
      caret-color: #f1f5f9 !important;
    }
    /* Number input spinner fix */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    /* Allow user text selection inside inputs */
    input, textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
    }
    /* Color picker special case — keep it circular, no border override */
    input[type=color] {
      background-color: transparent !important;
      border: none !important;
      border-radius: 50% !important;
      box-shadow: none !important;
      padding: 0 !important;
      width: 18px !important;
      height: 18px !important;
      cursor: pointer !important;
    }
    /* Textarea — allow vertical resize, prevent horizontal */
    textarea {
      resize: vertical !important;
      min-height: 72px;
    }
    /* Nav bar scroll container */
    .nav-scroll {
      display: flex;
      gap: 0;
      overflow-x: auto;
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      justify-content: space-around;
    }
    .nav-scroll::-webkit-scrollbar { display: none; }

    /* =============================================
       MODERN NAV ITEM ACTIVE STATE
       ============================================= */
    .nav-item {
      position: relative;
      border-radius: 12px;
      min-width: 44px;
      flex: 1 1 0;
      min-height: 52px;
      color: #cbd5e1 !important;
    }
    .nav-item span {
      color: inherit !important;
      opacity: 0.95;
    }
    .nav-item i {
      color: inherit !important;
      opacity: 0.95;
    }
    .nav-item.active {
      background: rgba(99, 102, 241, 0.12);
      color: #818cf8 !important;
    }
    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 18px;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 2px 2px 0 0;
    }

    /* =============================================
       FOCUS RING ACCESSIBLE IMPROVEMENTS
       ============================================= */
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid rgba(168, 85, 247, 0.6) !important;
      outline-offset: 2px !important;
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.18; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.18); }
    }
    .ambient-glow {
      animation: pulse-glow 9s ease-in-out infinite;
      transition: all 1.2s ease-in-out;
    }
    .screen {
      opacity: 0;
      transform: translateY(12px) scale(0.99);
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .screen.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      position: relative;
    }
    button, input, select, textarea, .nav-item {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    button:active, .nav-item:active {
      transform: scale(0.94) !important;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    @keyframes breathe-circle {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      35% { transform: scale(1.6); opacity: 0.95; }
      85% { transform: scale(1.6); opacity: 0.95; }
    }
    .animate-breathe {
      animation: breathe-circle 19s ease-in-out infinite;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.9); }
      20% { opacity: 1; transform: translateY(0) scale(1); }
      80% { opacity: 1; transform: translateY(-10px) scale(1); }
      100% { opacity: 0; transform: translateY(-20px) scale(0.9); }
    }
    .xp-toast {
      animation: floatUp 2.4s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    #spotlight-box {
      position: fixed;
      z-index: 300;
      border: 2px solid #818cf8;
      border-radius: 24px;
      box-shadow: 0 0 0 9999px rgba(9, 10, 15, 0.90), 0 0 35px rgba(129, 140, 248, 0.55);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none !important;
    }
    #spotlight-card {
      position: fixed;
      z-index: 310;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes pulse-node {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 16px 4px rgba(168, 85, 247, 0.6); }
    }
    .node-pulse {
      animation: pulse-node 2.2s ease-in-out infinite;
    }
    @keyframes mic-listening {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6); transform: scale(1); }
      50% { box-shadow: 0 0 15px 5px rgba(244, 63, 94, 0.8); transform: scale(1.1); }
    }
    .mic-active {
      animation: mic-listening 1.2s infinite;
      background-color: rgba(244, 63, 94, 0.3) !important;
      border-color: rgba(244, 63, 94, 0.6) !important;
      color: #f43f5e !important;
    }
    
    /* 2 Billion Dollar Premium Onboarding Animations */
    @keyframes stagger-fade-up {
      0% { opacity: 0; transform: translateY(24px) scale(0.98); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes slow-pan {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes premium-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.2); }
      50% { transform: scale(1.02); box-shadow: 0 0 25px 5px rgba(168, 85, 247, 0.4); }
    }
    
    .animate-stagger-1 { animation: stagger-fade-up 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 0.2s; opacity: 0; }
    .animate-stagger-2 { animation: stagger-fade-up 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 0.4s; opacity: 0; }
    .animate-stagger-3 { animation: stagger-fade-up 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 0.6s; opacity: 0; }
    .animate-stagger-4 { animation: stagger-fade-up 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 0.8s; opacity: 0; }
    .animate-stagger-5 { animation: stagger-fade-up 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards 1.0s; opacity: 0; }
    
    .premium-text-gradient {
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 40%, #e879f9 70%, #fcd34d 100%);
      background-size: 300% 300%;
      animation: slow-pan 8s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .premium-glass-card {
      background: linear-gradient(145deg, rgba(15,23,42,0.85) 0%, rgba(30,27,75,0.75) 100%);
      box-shadow: 0 40px 80px -20px rgba(0,0,0,0.9), inset 0 1px 0 0 rgba(255,255,255,0.2), inset 0 0 40px rgba(139,92,246,0.15);
      backdrop-filter: blur(60px);
      -webkit-backdrop-filter: blur(60px);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .premium-button {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      background-size: 200% 200%;
      animation: slow-pan 4s ease infinite;
      box-shadow: 0 12px 30px -5px rgba(168,85,247,0.6), inset 0 1px 0 0 rgba(255,255,255,0.4);
      position: relative;
      overflow: hidden;
      border: none;
    }
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: var(--grad-glow);
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.4s ease;
      opacity: 0.7;
    }
    .glass-card > * { position: relative; z-index: 1; }
    .glass-card:hover {
      border-color: rgba(168, 85, 247, 0.4);
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 16px 32px -10px rgba(168, 85, 247, 0.25);
    }
    .glass-card:hover::before {
      opacity: 1;
    }
    .premium-button::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(to bottom right, rgba(255,255,255,0) 40%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 60%);
      transform: rotate(45deg);
      transition: all 0.6s ease;
    }
    .premium-button:hover::after {
      transform: rotate(45deg) translate(50%, 50%);
    }
    .hover-tilt {
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .hover-tilt:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 16px 32px -10px rgba(168, 85, 247, 0.5);
      border-color: rgba(168, 85, 247, 0.6) !important;
      background-color: rgba(168, 85, 247, 0.15) !important;
    }
    
    .intro-step {
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      transition: opacity 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: absolute;
      pointer-events: none;
      visibility: hidden;
    }
    .intro-step.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      position: relative;
      pointer-events: auto;
      visibility: visible;
    }
    .luxury-input {
      background: rgba(0,0,0,0.4) !important;
      border: 1px solid rgba(255,255,255,0.15) !important;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
      transition: all 0.4s ease !important;
    }
    .luxury-input:focus {
      border-color: rgba(236, 72, 153, 0.7) !important;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 20px 2px rgba(236, 72, 153, 0.3) !important;
      background: rgba(15,23,42,0.6) !important;
    }
  </style>

<body class="min-h-screen min-h-[100dvh] w-full max-w-full overflow-x-hidden text-slate-100 flex flex-col pt-safe pb-safe">

  <!-- ULTRA-PREMIUM CONVERSION LANDING PAGE -->

      <div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-emerald-900/20 blur-[140px] animate-pulse mix-blend-screen" style="animation-delay: 2s"></div>
    </div>
    
    <!-- Hero Content -->
    <div class="relative z-10 min-h-screen flex flex-col justify-between pt-16 pb-8 px-6 sm:px-12">

        <!-- Big CTA Button -->

            Enter Sanctuary
          </button>
          <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-4">Secure, Private, and Transformative.</p>
        </div>
      </div>
